# Tests and Concipio's own checks, on every pull request and on main. Only
# GitHub's own actions are used, so an organization that restricts actions
# to GitHub's own still runs this.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --quiet uv
      - run: uv sync --frozen --python ${{ matrix.python }}
      - run: uv run --frozen pytest -q

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The score is compared with the pull request's base, so the
          # history must be there.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet uv
      - run: uv sync --frozen
      # Concipio's own docs hold to its own rules.
      - run: uv run --frozen cpo lint --human
      # A pull request may not leave the docs worse than its base.
      - if: github.event_name == 'pull_request'
        run: uv run --frozen cpo status --human --against "origin/${{ github.base_ref }}"
