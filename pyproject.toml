[project]
name = "concipio"
version = "0.0.1"
description = "Map every changed line of code to the concept it serves"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.26.0",
    "markdown>=3.11.2",
    "tomli-w>=1.2.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-bash>=0.25.1",
    "tree-sitter-c>=0.24.2",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-perl>=2.0.4",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-ruby>=0.23.1",
    "tree-sitter-rust>=0.24.2",
]

[project.scripts]
cpo = "concipio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
